name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.release }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.arch }}-${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          # - aarch64_cortex-a72
          # - aarch64_generic
          # - arm_arm1176jzf-s_vfp
          # - arm_arm926ej-s
          # - arm_cortex-a15_neon-vfpv4
          # - arm_cortex-a5_vfpv4
          # - arm_cortex-a7
          # - arm_cortex-a7_neon-vfpv4
          # - arm_cortex-a8_vfpv3
          # - arm_cortex-a9
          # - arm_cortex-a9_neon
          # - arm_cortex-a9_vfpv3-d16
          # - arm_fa526
          # - arm_mpcore
          # - arm_xscale
          # - i386_pentium-mmx
          # - i386_pentium4
          # - mips64_octeonplus
          # - mips_24kc
          # - mips_4kec
          # - mips_mips32
          # - mipsel_24kc
          # - mipsel_24kc_24kf
          # - mipsel_74kc
          # - mipsel_mips32
          # - x86_64
        release:
          - openwrt-25.12
          - SNAPSHOT
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Building packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ env.TARGET }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-ddns-go
          NO_REFRESH_CHECK: true
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TARGET }}
          path: bin/packages/${{ env.TARGET }}/packages_ci/*.[ai]pk

      - name: Rename packages with target
        run: |
          for f in bin/packages/${TARGET}/packages_ci/*.[ai]pk; do
            [ -e "$f" ] || continue   # 防止 glob 为空时报错
          
            dir=$(dirname "$f")
            base=$(basename "$f")     # e.g. ddns-go-6.15.0-r1.apk
            ext="${base##*.}"         # apk 或 ipk
            name="${base%.*}"         # ddns-go-6.15.0-r1
          
            mv "$f" "${dir}/${name}-${TARGET}.${ext}"
          done

      - name: Upload packages
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/packages/${{ env.TARGET }}/packages_ci/*.[ai]pk"
