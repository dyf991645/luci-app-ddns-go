name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  prepare:
      runs-on: ubuntu-latest
      outputs:
        release_tag: ${{ steps.tag_logic.outputs.final_tag }}
      steps:
        - id: tag_logic
          run: |
            if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "final_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            else
              echo "final_tag=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
            fi

  build-luci:
    name: Build luci packages
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Building luci packages (arch independent)
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: latest
          FEEDNAME: packages_ci
          PACKAGES: "luci-app-ddns-go"
          NO_REFRESH_CHECK: true
          V: s

      - name: Add suffix to luci packages
        run: |
          for file in bin/packages/*/packages_ci/*.[ai]pk; do
            dir=$(dirname "$file")
            filename=$(basename "$file")
            newname="${filename%.*}_all.${filename##*.}"
            mv "$file" "$dir/$newname"
          done

      - name: Upload luci artifacts
        uses: actions/upload-artifact@v6
        with:
          name: luci-packages
          path: bin/packages/*/packages_ci/luci-*.[ai]pk

  build-core:
    name: Build core ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          # - aarch64_cortex-a72
          # - aarch64_generic
          # - arm_arm1176jzf-s_vfp
          # - arm_arm926ej-s
          # - arm_cortex-a15_neon-vfpv4
          # - arm_cortex-a5_vfpv4
          # - arm_cortex-a7
          # - arm_cortex-a7_neon-vfpv4
          # - arm_cortex-a8_vfpv3
          # - arm_cortex-a9
          # - arm_cortex-a9_neon
          # - arm_cortex-a9_vfpv3-d16
          # - arm_fa526
          # - arm_mpcore
          # - arm_xscale
          # - i386_pentium-mmx
          # - i386_pentium4
          # - mips64_octeonplus
          # - mips_24kc
          # - mips_4kec
          # - mips_mips32
          # - mipsel_24kc
          # - mipsel_24kc_24kf
          # - mipsel_74kc
          # - mipsel_mips32
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
          
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Building ddns-go
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          PACKAGES: ddns-go
          NO_REFRESH_CHECK: true
          V: s

      - name: Add arch suffix to ddns-go
        run: |
          for file in bin/packages/${{ matrix.arch }}/packages_ci/*.[ai]pk; do
            dir=$(dirname "$file")
            filename=$(basename "$file")
            newname="${filename%.*}_${{ matrix.arch }}.${filename##*.}"
            mv "$file" "$dir/$newname"
          done

      - name: Upload ddns-go artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.[ai]pk

  release:
    name: Release all artifacts
    needs: [prepare, build-luci, build-core]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts

      - name: Collect artifacts to release
        run: |
          mkdir -p release_files
          find ./artifacts -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} release_files/ \;

      - name: Release all artifacts
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.prepare.outputs.release_tag }}
          tag: ${{ needs.prepare.outputs.release_tag }}
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "release_files/*"
