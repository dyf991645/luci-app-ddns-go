name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  prepare:
      runs-on: ubuntu-latest
      outputs:
        release_tag: ${{ steps.tag_logic.outputs.final_tag }}
      steps:
        - id: tag_logic
          run: |
            if [ "${{ github.ref_type }}" == "tag" ]; then
              echo "final_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            else
              echo "final_tag=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
            fi
  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          # - aarch64_cortex-a72
          # - aarch64_generic
          # - arm_arm1176jzf-s_vfp
          # - arm_arm926ej-s
          # - arm_cortex-a15_neon-vfpv4
          # - arm_cortex-a5_vfpv4
          # - arm_cortex-a7
          # - arm_cortex-a7_neon-vfpv4
          # - arm_cortex-a8_vfpv3
          # - arm_cortex-a9
          # - arm_cortex-a9_neon
          # - arm_cortex-a9_vfpv3-d16
          # - arm_fa526
          # - arm_mpcore
          # - arm_xscale
          # - i386_pentium-mmx
          # - i386_pentium4
          # - mips64_octeonplus
          # - mips_24kc
          # - mips_4kec
          # - mips_mips32
          # - mipsel_24kc
          # - mipsel_24kc_24kf
          # - mipsel_74kc
          # - mipsel_mips32
          # - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine Tag Name
        id: tag_logic
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            # 如果是 push tags 触发，直接使用当前的 tag 名
            echo "final_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Using existing git tag: ${{ github.ref_name }}"
          else
            # 否则（如 workflow_dispatch），生成一个带时间戳的新 tag
            NEW_TAG="manual-$(date +'%Y%m%d-%H%M%S')"
            echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            echo "Generated new tag: $NEW_TAG"
          fi
          
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Building packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-ddns-go
          NO_REFRESH_CHECK: true
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.[ai]pk

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.prepare.outputs.release_tag }}
          tag: ${{ needs.prepare.outputs.release_tag }}
          commit: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*.[ai]pk"
